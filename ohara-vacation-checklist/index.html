<style>html,body{height:100%;margin:0}body{display:grid;place-items:center;font:16px/1.45 Segoe UI,Arial,sans-serif;background:#fffdf8;color:#1d1d21}.load{max-width:520px;padding:28px;text-align:center}.mark{font-size:28px;font-weight:900;letter-spacing:.08em;color:#c9152e}.bar{height:8px;margin:18px 0;border-radius:99px;background:#eee;overflow:hidden}.bar:after{content:"";display:block;width:45%;height:100%;border-radius:inherit;background:#c9152e;animation:m 1s infinite alternate ease-in-out}@keyframes m{to{transform:translateX(120%)}}</style>

<body><div class="load"><div class="mark">O'HARA</div><div class="bar"></div><div id="msg">Открываю интерактивный чек-лист…</div></div>

try{const html=window.__OHARA_PARTS.join("");if(!html.startsWith("<!doctype html>"))throw new Error("incomplete");document.open();document.write(html);document.close();}catch(e){document.getElementById("msg").textContent="Не удалось загрузить прототип. Обновите страницу.";}
