<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Биржа материалов</title>
<style>
:root{--bg:#090b12;--card:#151927;--muted:#8d96ad;--text:#f5f7ff;--red:#ff3046;--green:#31d07b;--line:#242a3d;--gold:#ffd36a;--silver:#dce4f2;--bronze:#d88b55;--diamond:#7ddcff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#202845 0,#090b12 46%,#05060a 100%);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}.wrap{max-width:520px;margin:0 auto;padding:18px 14px 90px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.brand h1{font-size:24px;line-height:1.05;margin:0}.brand p{margin:6px 0 0;color:var(--muted);font-size:13px}.pill{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:18px;padding:10px 12px;text-align:right}.pill b{display:block;font-size:22px}.tabs{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:rgba(9,11,18,.88);backdrop-filter:blur(12px);padding:8px 0 12px}.tab{border:1px solid var(--line);background:#101421;color:var(--text);border-radius:14px;padding:12px 8px;font-weight:800}.tab.active{background:var(--red);border-color:var(--red)}.panel{display:none}.panel.active{display:block}.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));border-radius:22px;padding:14px;margin:12px 0;box-shadow:0 18px 60px rgba(0,0,0,.22)}.asset{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:center}.coin{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:30px;border:2px solid rgba(255,255,255,.22);box-shadow:inset 0 0 18px rgba(255,255,255,.18)}.gold{background:linear-gradient(135deg,#7a4a00,var(--gold))}.silver{background:linear-gradient(135deg,#677083,var(--silver))}.bronze{background:linear-gradient(135deg,#6b351d,var(--bronze))}.diamond{background:linear-gradient(135deg,#006c9e,var(--diamond));border-radius:18px;transform:rotate(45deg)}.diamond span{transform:rotate(-45deg)}h2,h3{margin:0}.meta{color:var(--muted);font-size:13px;margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.stat{background:#0e1320;border:1px solid var(--line);border-radius:16px;padding:10px}.stat small{display:block;color:var(--muted);font-size:12px}.stat b{font-size:18px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.btn{border:0;border-radius:16px;padding:13px 10px;font-size:15px;font-weight:900;color:#fff;background:#2c354f}.buy{background:var(--green);color:#06130b}.sell{background:var(--red)}.btn:disabled{opacity:.42}.admin-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;color:var(--muted)}input{width:100%;border:1px solid var(--line);background:#0e1320;color:var(--text);border-radius:14px;padding:12px;font-size:16px}.notice{color:var(--muted);font-size:13px;line-height:1.35}.toast{position:fixed;left:14px;right:14px;bottom:18px;max-width:492px;margin:auto;background:#111727;border:1px solid var(--line);border-radius:18px;padding:13px 14px;box-shadow:0 18px 80px rgba(0,0,0,.5);display:none}.toast.show{display:block}.danger{color:#ff9aa6}.ok{color:#86f3b0}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{border-bottom:1px solid var(--line);padding:9px 4px;text-align:left}.reset{width:100%;margin-top:10px;background:#242b40}.footer{color:var(--muted);font-size:12px;margin-top:16px;line-height:1.4}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><h1>Биржа материалов</h1><p>мобильная HTML-игра: покупай, продавай, управляй складом</p></div>
    <div class="pill"><small>Баланс</small><b id="balance">0</b></div>
  </div>
  <div class="tabs"><button class="tab active" data-tab="market">Биржа</button><button class="tab" data-tab="cabinet">ЛК</button><button class="tab" data-tab="admin">Админ</button></div>
  <section id="market" class="panel active"></section>
  <section id="cabinet" class="panel"></section>
  <section id="admin" class="panel"></section>
  <div class="footer">Данные сохраняются в localStorage телефона. Админ-таблица меняет текущую цену покупки на бирже и лимит доступных единиц. Продажа пользователем всегда считается как 90% от номинала материала.</div>
</div>
<div id="toast" class="toast"></div>
<script>
const DEFAULT={balance:2000,assets:{gold:{name:'Золото',icon:'Au',cls:'gold',nominal:100,price:100,stock:null,user:1},silver:{name:'Серебро',icon:'Ag',cls:'silver',nominal:200,price:200,stock:null,user:1},bronze:{name:'Бронза',icon:'Br',cls:'bronze',nominal:500,price:500,stock:null,user:1},diamond:{name:'Алмазы',icon:'◆',cls:'diamond',nominal:1000,price:1000,stock:null,user:1}}};
let state=load();
function load(){try{return JSON.parse(localStorage.getItem('coinExchangeGame'))||structuredClone(DEFAULT)}catch(e){return structuredClone(DEFAULT)}}
function save(){localStorage.setItem('coinExchangeGame',JSON.stringify(state));render()}
function money(n){return Math.round(Number(n)||0).toLocaleString('ru-RU')}
function sellPrice(a){return Math.round(a.nominal*.9)}
function toast(t,ok=true){const el=document.getElementById('toast');el.innerHTML=(ok?'<span class="ok">':'<span class="danger">')+t+'</span>';el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1700)}
function buy(k){const a=state.assets[k];if(a.stock!==null&&a.stock<=0)return toast('На бирже закончился лимит',false);if(state.balance<a.price)return toast('Не хватает баллов',false);state.balance-=a.price;a.user++;if(a.stock!==null)a.stock--;save();toast('Куплено: '+a.name)}
function sell(k){const a=state.assets[k];if(a.user<=0)return toast('Нечего продавать',false);const p=sellPrice(a);a.user--;state.balance+=p;if(a.stock!==null)a.stock++;save();toast('Продано за '+money(p)+' баллов')}
function setAdmin(k,field,val){const a=state.assets[k];if(field==='price')a.price=Math.max(0,Math.round(Number(val)||0));if(field==='stock'){const v=String(val).trim();a.stock=v===''?null:Math.max(0,Math.round(Number(v)||0))}save()}
function resetGame(){state=structuredClone(DEFAULT);save();toast('Игра сброшена')}
function coinHtml(a){return `<div class="coin ${a.cls}"><span>${a.icon}</span></div>`}
function renderMarket(){document.getElementById('market').innerHTML=Object.entries(state.assets).map(([k,a])=>`<div class="card"><div class="asset">${coinHtml(a)}<div><h3>${a.name}</h3><div class="meta">Номинал: ${money(a.nominal)} · продажа: ${money(sellPrice(a))} · цена биржи: ${money(a.price)}</div></div></div><div class="grid"><div class="stat"><small>У тебя</small><b>${money(a.user)} ед.</b></div><div class="stat"><small>Лимит биржи</small><b>${a.stock===null?'∞':money(a.stock)}</b></div></div><div class="actions"><button class="btn buy" onclick="buy('${k}')">Купить</button><button class="btn sell" onclick="sell('${k}')">Продать</button></div></div>`).join('')}
function renderCabinet(){const total=Object.values(state.assets).reduce((s,a)=>s+a.user*sellPrice(a),0);document.getElementById('cabinet').innerHTML=`<div class="card"><h2>Личный кабинет</h2><p class="notice">Здесь виден баланс, портфель и оценка активов по цене продажи — 90% от номинала.</p><div class="grid"><div class="stat"><small>Баланс</small><b>${money(state.balance)}</b></div><div class="stat"><small>Оценка портфеля</small><b>${money(total)}</b></div></div></div><div class="card"><table class="table"><thead><tr><th>Материал</th><th>Кол-во</th><th>Продажа/ед.</th><th>Сумма</th></tr></thead><tbody>${Object.values(state.assets).map(a=>`<tr><td>${a.name}</td><td>${money(a.user)}</td><td>${money(sellPrice(a))}</td><td>${money(a.user*sellPrice(a))}</td></tr>`).join('')}</tbody></table></div>`}
function renderAdmin(){document.getElementById('admin').innerHTML=`<div class="card"><h2>Админ-таблица</h2><p class="notice">Цена — текущая стоимость покупки на бирже. Лимит пустой = бесконечно. Лимит уменьшается при покупке и возвращается при продаже.</p></div>`+Object.entries(state.assets).map(([k,a])=>`<div class="card"><div class="asset">${coinHtml(a)}<div><h3>${a.name}</h3><div class="meta">Номинал ${money(a.nominal)} · пользователь продаёт за ${money(sellPrice(a))}</div></div></div><div class="admin-row"><div class="field"><label>Цена покупки на бирже</label><input type="number" min="0" value="${a.price}" onchange="setAdmin('${k}','price',this.value)"></div><div class="field"><label>Лимит единиц на продаже</label><input type="number" min="0" placeholder="∞" value="${a.stock===null?'':a.stock}" onchange="setAdmin('${k}','stock',this.value)"></div></div></div>`).join('')+`<button class="btn reset" onclick="resetGame()">Сбросить игру</button>`}
function render(){document.getElementById('balance').textContent=money(state.balance);renderMarket();renderCabinet();renderAdmin()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});
render();
</script>
</body>
</html>
