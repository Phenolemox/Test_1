name: Deploy Quiz Calculator to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "quiz-calculator/**"
      - ".github/workflows/quiz-calculator-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "quiz-calculator-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "quiz-calculator"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
