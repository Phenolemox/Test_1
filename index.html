<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Биржа материалов</title><style>*{box-sizing:border-box}body{margin:0;background:#090b12;color:#f5f7ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:520px;margin:auto;padding:16px 12px 80px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.bal,.card{background:#151927;border:1px solid #293149;border-radius:20px;padding:14px;margin:12px 0}.bal{text-align:right;min-width:120px}.bal b{font-size:24px}.tabs{position:sticky;top:0;background:#090b12;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 0}.tab,button{border:0;border-radius:14px;padding:12px;font-weight:900;color:#fff;background:#2c354f}.tab.active{background:#ff3046}.panel{display:none}.panel.active{display:block}.coin{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:900}.gold{background:linear-gradient(135deg,#7a4a00,#ffd36a)}.silver{background:linear-gradient(135deg,#677083,#dce4f2);color:#111}.bronze{background:linear-gradient(135deg,#6b351d,#d88b55)}.diamond{background:linear-gradient(135deg,#006c9e,#7ddcff);border-radius:18px;transform:rotate(45deg)}.diamond span{transform:rotate(-45deg)}.asset{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:center}.meta,.small{color:#8d96ad;font-size:13px}.grid,.actions,.admin{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.stat{background:#0e1320;border-radius:14px;padding:10px}.stat b{display:block;font-size:18px}.buy{background:#31d07b;color:#06130b}.sell{background:#ff3046}input{width:100%;border:1px solid #293149;background:#0e1320;color:#fff;border-radius:12px;padding:11px;font-size:16px}label{display:block;color:#8d96ad;font-size:12px;margin:8px 0 4px}.toast{position:fixed;left:12px;right:12px;bottom:14px;background:#111727;border:1px solid #293149;border-radius:16px;padding:12px;display:none}.toast.show{display:block}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #293149;padding:8px;text-align:left}</style></head><body><div class="wrap"><div class="top"><div><h1>Биржа материалов</h1><div class="small">покупай, продавай, управляй рынком</div></div><div class="bal"><div class="small">Баланс</div><b id="balance"></b></div></div><div class="tabs"><button class="tab active" data-tab="market">Биржа</button><button class="tab" data-tab="cabinet">ЛК</button><button class="tab" data-tab="admin">Админ</button></div><section id="market" class="panel active"></section><section id="cabinet" class="panel"></section><section id="admin" class="panel"></section></div><div id="toast" class="toast"></div><script>const D={balance:2000,assets:{gold:{name:'Золото',icon:'Au',cls:'gold',nominal:100,price:100,stock:null,user:1},silver:{name:'Серебро',icon:'Ag',cls:'silver',nominal:200,price:200,stock:null,user:1},bronze:{name:'Бронза',icon:'Br',cls:'bronze',nominal:500,price:500,stock:null,user:1},diamond:{name:'Алмазы',icon:'◆',cls:'diamond',nominal:1000,price:1000,stock:null,user:1}}};let S=load();function clone(o){return JSON.parse(JSON.stringify(o))}function load(){try{return JSON.parse(localStorage.getItem('coinExchangeGameRoot'))||clone(D)}catch(e){return clone(D)}}function save(){localStorage.setItem('coinExchangeGameRoot',JSON.stringify(S));render()}function m(n){return Math.round(+n||0).toLocaleString('ru-RU')}function sp(a){return Math.round(a.nominal*.9)}function msg(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1400)}function buy(k){let a=S.assets[k];if(a.stock!==null&&a.stock<=0)return msg('Лимит на бирже закончился');if(S.balance<a.price)return msg('Не хватает баллов');S.balance-=a.price;a.user++;if(a.stock!==null)a.stock--;save();msg('Куплено: '+a.name)}function sell(k){let a=S.assets[k];if(a.user<=0)return msg('Нечего продавать');a.user--;S.balance+=sp(a);if(a.stock!==null)a.stock++;save();msg('Продано за '+m(sp(a)))}function adm(k,f,v){let a=S.assets[k];if(f==='price')a.price=Math.max(0,Math.round(+v||0));else a.stock=String(v).trim()===''?null:Math.max(0,Math.round(+v||0));save()}function reset(){S=clone(D);save();msg('Игра сброшена')}function coin(a){return `<div class="coin ${a.cls}"><span>${a.icon}</span></div>`}function render(){balance.textContent=m(S.balance);market.innerHTML=Object.entries(S.assets).map(([k,a])=>`<div class="card"><div class="asset">${coin(a)}<div><h3>${a.name}</h3><div class="meta">Номинал ${m(a.nominal)} · продажа ${m(sp(a))} · цена ${m(a.price)}</div></div></div><div class="grid"><div class="stat"><span class="small">У тебя</span><b>${m(a.user)}</b></div><div class="stat"><span class="small">Лимит</span><b>${a.stock===null?'∞':m(a.stock)}</b></div></div><div class="actions"><button class="buy" onclick="buy('${k}')">Купить</button><button class="sell" onclick="sell('${k}')">Продать</button></div></div>`).join('');let total=Object.values(S.assets).reduce((s,a)=>s+a.user*sp(a),0);cabinet.innerHTML=`<div class="card"><h2>Личный кабинет</h2><div class="grid"><div class="stat"><span class="small">Баланс</span><b>${m(S.balance)}</b></div><div class="stat"><span class="small">Портфель</span><b>${m(total)}</b></div></div></div><div class="card"><table><tr><th>Материал</th><th>Кол-во</th><th>Сумма продажи</th></tr>${Object.values(S.assets).map(a=>`<tr><td>${a.name}</td><td>${m(a.user)}</td><td>${m(a.user*sp(a))}</td></tr>`).join('')}</table></div>`;admin.innerHTML=`<div class="card"><h2>Админ-таблица</h2><div class="small">Цена = покупка на бирже. Лимит пустой = бесконечно.</div></div>`+Object.entries(S.assets).map(([k,a])=>`<div class="card"><div class="asset">${coin(a)}<div><h3>${a.name}</h3><div class="meta">Продажа пользователя: ${m(sp(a))}</div></div></div><div class="admin"><div><label>Цена покупки</label><input type="number" value="${a.price}" onchange="adm('${k}','price',this.value)"></div><div><label>Лимит единиц</label><input type="number" placeholder="∞" value="${a.stock===null?'':a.stock}" onchange="adm('${k}','stock',this.value)"></div></div></div>`).join('')+`<button onclick="reset()">Сбросить игру</button>`}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});render();</script></body></html>
